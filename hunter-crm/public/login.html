<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Hunter CRM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-wrap">
    <div class="panel auth-card">
        <a href="/" class="brand"><span class="dot"></span><span class="gradient-text">HUNTER</span>CRM</a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Log in to pick up where you left off.</p>

        <div class="error-msg" id="error"></div>

        <form id="login-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submit">Log in</button>
        </form>

        <div class="auth-switch">
            No workspace yet? <a href="/register.html">Create one</a>
        </div>

        <div class="demo-hint">
            Demo account — <code>demo@huntercrm.test</code> / <code>demo1234</code>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
const form = document.getElementById('login-form');
const errorEl = document.getElementById('error');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorEl.classList.remove('show');
    submit.disabled = true;

    try {
        const { token, user } = await apiPost('/api/auth/login', {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
        });
        Auth.setSession(token, user);
        window.location.href = '/dashboard.html';
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        submit.disabled = false;
    }
});
</script>
</body>
</html>
