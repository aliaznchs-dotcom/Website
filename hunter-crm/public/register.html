<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create workspace — Hunter CRM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-wrap">
    <div class="panel auth-card">
        <a href="/" class="brand"><span class="dot"></span><span class="gradient-text">HUNTER</span>CRM</a>
        <h1 class="auth-title">Start hunting</h1>
        <p class="auth-sub">Your own workspace — leads, pipeline and activity, all private to you.</p>

        <div class="error-msg" id="error"></div>

        <form id="register-form">
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" autocomplete="name" required />
            </div>
            <div class="field">
                <label for="email">Work email</label>
                <input type="email" id="email" autocomplete="email" required />
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" minlength="8" required />
                <div class="small muted mt-8">At least 8 characters.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submit">Create workspace</button>
        </form>

        <div class="auth-switch">
            Already have one? <a href="/login.html">Log in</a>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
const form = document.getElementById('register-form');
const errorEl = document.getElementById('error');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorEl.classList.remove('show');
    submit.disabled = true;

    try {
        const { token, user } = await apiPost('/api/auth/register', {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
        });
        Auth.setSession(token, user);
        window.location.href = '/dashboard.html';
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
        submit.disabled = false;
    }
});
</script>
</body>
</html>
